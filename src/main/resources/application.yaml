spring:
  application:
    name: link-shortener-server
  datasource:
    url: jdbc:postgresql://postgres:5432/links
    username: ${POSTGRES_USER:user}
    password: ${POSTGRES_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

link-shortener:
  base-url: "${SHORTENER_BASE_URL:http://localhost:8080}"

grpc:
  server:
    port: 9090
