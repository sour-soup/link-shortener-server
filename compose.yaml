services:
  app:
    build: .
    container_name: grpc-link-service
    ports:
      - "9090:9090"
    depends_on:
      - postgres
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - app-net

  postgres:
    image: postgres:17.1-alpine
    container_name: grpc-postgres
    restart: always
    environment:
      POSTGRES_DB: links
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
